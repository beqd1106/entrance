# XcodeGen プロジェクト定義
#   生成: cd ios && xcodegen generate
# Macがなくても GitHub Actions（macOSランナー）でビルド〜TestFlight配信ができる。
name: Houserule
options:
  bundleIdPrefix: com.beqd1106
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual

targets:
  Houserule:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # www はフォルダ参照で丸ごと同梱する（web/ と src/ の相対パスを保つため）
      - path: www
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    # info: は書かないこと。
    #   XcodeGen は info: があると Info.plist を「生成」して、
    #   手で書いた Resources/Info.plist を丸ごと上書きしてしまう。
    #   その結果 ITSAppUsesNonExemptEncryption・画面向き・表示名などが全部消え、
    #   TestFlight で「インストール可能なビルドが無い」状態になっていた。
    #   INFOPLIST_FILE だけを指すことで、書いたものがそのまま使われる。
    settings:
      base:
        # XcodeGen のターゲットプリセットが 1.0 / 1 を入れてしまうので、
        # ここで明示して上書きする（CIが書き換えるのもこの2行）
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: Houserule
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.entrance
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 端末ファミリはターゲット側で明示（iPad必須化の事故を避ける）
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
