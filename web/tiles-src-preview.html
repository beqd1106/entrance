<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>取り込んだ牌素材の確認</title>
<style>
  body { margin: 0; padding: 20px; background: #26443c; font-family: system-ui, sans-serif; }
  h3 { color: #eae4d6; font-size: 13px; margin: 14px 0 6px; letter-spacing: .1em; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .t { display: block; }
  .lg .t { width: 96px; }
  .md .t { width: 40px; }
  .sm .t { width: 26px; }
  .xs .t { width: 18px; }
</style>
</head><body>
<div id="out"></div>
<script>
const NAMES = {
  man: ['Man1','Man2','Man3','Man4','Man5','Man6','Man7','Man8','Man9'],
  pin: ['Pin1','Pin2','Pin3','Pin4','Pin5','Pin6','Pin7','Pin8','Pin9'],
  sou: ['Sou1','Sou2','Sou3','Sou4','Sou5','Sou6','Sou7','Sou8','Sou9'],
  ji:  ['Ton','Nan','Shaa','Pei','Haku','Hatsu','Chun'],
  dora:['Man5-Dora','Pin5-Dora','Sou5-Dora','Back','Front'],
};
const out = document.getElementById('out');
const add = (title, list, size) => {
  const h = document.createElement('h3'); h.textContent = title; out.appendChild(h);
  const row = document.createElement('div'); row.className = 'row ' + size;
  for (const n of list) {
    const img = document.createElement('img');
    img.className = 't'; img.src = 'img/tiles/' + n + '.svg'; img.alt = n;
    row.appendChild(img);
  }
  out.appendChild(row);
};
add('拡大（絵柄の確認）', ['Sou1','Sou2','Sou5','Sou9','Pin1','Pin5','Pin9','Man1','Man5'], 'lg');
add('手牌サイズ 40px', [...NAMES.sou], 'md');
add('河サイズ 26px（索子）', [...NAMES.sou], 'sm');
add('河サイズ 26px（筒子）', [...NAMES.pin], 'sm');
add('河サイズ 26px（萬子）', [...NAMES.man], 'sm');
add('最小 18px（索子）', [...NAMES.sou], 'xs');
add('萬子', NAMES.man, 'md');
add('筒子', NAMES.pin, 'md');
add('索子', NAMES.sou, 'md');
add('字牌', NAMES.ji, 'md');
add('赤ドラ・裏・枠', NAMES.dora, 'md');
</script>
</body></html>
