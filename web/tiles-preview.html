<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>牌面プレビュー</title>
<link rel="stylesheet" href="css/style.css">
<style>body{padding:24px;background:#1b4034}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
h3{color:#eae4d6;font-size:13px;margin:10px 0 6px;letter-spacing:.1em}</style>
</head><body>
<div id="out"></div>
<script type="module">
import { tileEl } from './js/ui.js';
const out = document.getElementById('out');
const add = (title, list) => {
  const h3 = document.createElement('h3'); h3.textContent = title; out.appendChild(h3);
  const row = document.createElement('div'); row.className = 'row';
  list.forEach(info => row.appendChild(tileEl(info, { size: 'lg' })));
  out.appendChild(row);
};
const range = (a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
// 実機で使う小さいサイズと、絵柄を確かめる大きいサイズを並べる
const addSized = (title, list, tw) => {
  const h3 = document.createElement('h3'); h3.textContent = title; out.appendChild(h3);
  const row = document.createElement('div'); row.className = 'row';
  list.forEach(info => {
    const el = tileEl(info, { size: 'lg' });
    el.style.setProperty('--tw', tw + 'px');
    row.appendChild(el);
  });
  out.appendChild(row);
};
addSized('拡大（絵柄の確認用）', [{t:18},{t:19},{t:22},{t:26},{t:9},{t:13},{t:17},{t:0},{t:4}], 96);
addSized('実機の手牌サイズ 34px', range(18,26).map(t=>({t})), 34);
addSized('実機の河サイズ 25px', range(18,26).map(t=>({t})), 25);
addSized('実機の河サイズ 25px（筒子）', range(9,17).map(t=>({t})), 25);
add('萬子', range(0,8).map(t=>({t})));
add('筒子', range(9,17).map(t=>({t})));
add('索子', range(18,26).map(t=>({t})));
add('字牌', range(27,33).map(t=>({t})));
add('花牌', range(34,37).map(t=>({t})));
add('属性', [
  {t:4,red:true},{t:13,red:true},{t:22,red:true},
  {t:13,gold:true},{t:22,gold:true},
  {t:22,blue:true},{t:9,star:true},{t:26,rainbow:true},
  {t:31,dot:true},{t:22,sp:'blue5s'},{hidden:true}
]);
</script></body></html>
