<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    OP画面の背景。墨の地に金の雲と流水、朱の雲を少しだけ。
    左半分は文字を置くので、意図的に空けてある。
    外部画像を使わずSVGで持つことで、オフラインでも欠けない。
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b332b"/>
      <stop offset="0.52" stop-color="#06211b"/>
      <stop offset="1" stop-color="#040f0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d79b"/>
      <stop offset="0.5" stop-color="#d8ab5c"/>
      <stop offset="1" stop-color="#9c7532"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c583" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a9813c" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="vermilion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1372c"/>
      <stop offset="1" stop-color="#6d1d18"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#ddd3bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c887" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e8c887" stop-opacity="0"/>
    </radialGradient>

    <!-- 青海波：地の奥で静かに効かせる -->
    <pattern id="seigaiha" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e8c887" stroke-opacity="0.10" stroke-width="1.1">
        <path d="M0 40a40 40 0 0180 0"/>
        <path d="M12 40a28 28 0 0156 0"/>
        <path d="M24 40a16 16 0 0132 0"/>
        <path d="M-40 40a40 40 0 0180 0"/>
        <path d="M40 40a40 40 0 0180 0"/>
      </g>
    </pattern>

    <!-- 雲の形（和柄の霞雲）。使い回して大きさと角度だけ変える -->
    <path id="kumo" d="M0 40c0-13 11-23 24-23 4-11 15-18 27-16 7-12 23-16 35-9 5-10 18-14 28-8 9-6 22-4 29 5 14-2 26 8 27 22 1 15-10 27-25 28H26C11 39 0 40 0 40Z"/>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>
  <rect width="1600" height="900" fill="url(#seigaiha)" opacity="0.5"/>

  <!-- 右上の光だまり -->
  <ellipse cx="1210" cy="150" rx="520" ry="330" fill="url(#glow)"/>

  <!-- 右上：金の雲 -->
  <g opacity="0.92">
    <g transform="translate(1120 40) scale(2.6)" fill="url(#goldSoft)" stroke="url(#gold)" stroke-width="1.1">
      <use href="#kumo"/>
    </g>
    <g transform="translate(1330 150) scale(1.7)" fill="url(#goldSoft)" stroke="url(#gold)" stroke-width="1.3">
      <use href="#kumo"/>
    </g>
    <g transform="translate(1000 190) scale(1.15)" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.65">
      <use href="#kumo"/>
    </g>
  </g>

  <!-- 右上：朱の雲（差し色。入れすぎない） -->
  <g opacity="0.72" transform="translate(1400 -20) scale(2.1)">
    <use href="#kumo" fill="url(#vermilion)" stroke="#c9a35d" stroke-width="0.8" stroke-opacity="0.6"/>
  </g>

  <!-- 右下：流水（金の線を重ねる） -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" opacity="0.55">
    <path d="M900 720c90-52 170-52 246 0 76 52 156 52 240 0 60-36 120-44 178-24" stroke-width="1.6"/>
    <path d="M900 752c90-52 170-52 246 0 76 52 156 52 240 0 60-36 120-44 178-24" stroke-width="1.1" opacity="0.75"/>
    <path d="M900 784c90-52 170-52 246 0 76 52 156 52 240 0 60-36 120-44 178-24" stroke-width="0.8" opacity="0.5"/>
    <path d="M1050 660c60-34 112-34 162 0" stroke-width="1"/>
    <path d="M1290 636c48-28 90-28 130 0" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- 左下：朱の雲をわずかに -->
  <g opacity="0.5" transform="translate(-120 700) scale(2.4)">
    <use href="#kumo" fill="url(#vermilion)" stroke="none"/>
  </g>
  <g opacity="0.45" transform="translate(60 800) scale(1.5)" fill="none" stroke="url(#gold)" stroke-width="1.2">
    <use href="#kumo"/>
  </g>

  <!-- 右下：牌を3枚だけ。主張させず、卓の気配として置く -->
  <g transform="translate(1268 664) rotate(-8) scale(0.82)" opacity="0.42">
    <g>
      <rect x="0" y="0" width="86" height="118" rx="12" fill="url(#ivory)"/>
      <rect x="0.6" y="0.6" width="84.8" height="116.8" rx="11.6" fill="none" stroke="#b7ab92" stroke-opacity="0.7"/>
      <circle cx="43" cy="59" r="21" fill="none" stroke="#1e6f57" stroke-width="4"/>
      <circle cx="43" cy="59" r="11" fill="none" stroke="#1e6f57" stroke-width="4"/>
      <circle cx="43" cy="59" r="4" fill="#b1372c"/>
    </g>
    <g transform="translate(104 26) rotate(7)">
      <rect x="0" y="0" width="86" height="118" rx="12" fill="url(#ivory)"/>
      <rect x="0.6" y="0.6" width="84.8" height="116.8" rx="11.6" fill="none" stroke="#b7ab92" stroke-opacity="0.7"/>
      <g stroke="#1e6f57" stroke-width="5" stroke-linecap="round">
        <path d="M26 40h34"/>
        <path d="M22 60h42"/>
        <path d="M28 80h30"/>
      </g>
    </g>
    <g transform="translate(210 58) rotate(15)">
      <rect x="0" y="0" width="86" height="118" rx="12" fill="url(#ivory)"/>
      <rect x="0.6" y="0.6" width="84.8" height="116.8" rx="11.6" fill="none" stroke="#b7ab92" stroke-opacity="0.7"/>
      <g fill="#b1372c">
        <circle cx="31" cy="45" r="7"/>
        <circle cx="55" cy="45" r="7"/>
        <circle cx="43" cy="62" r="7"/>
        <circle cx="31" cy="79" r="7"/>
        <circle cx="55" cy="79" r="7"/>
      </g>
    </g>
  </g>

  <!-- 金砂子 -->
  <g fill="#f0d49a">
    <circle cx="980" cy="120" r="2.6" opacity="0.55"/>
    <circle cx="1042" cy="248" r="1.8" opacity="0.4"/>
    <circle cx="1120" cy="96" r="1.5" opacity="0.5"/>
    <circle cx="1246" cy="300" r="2.2" opacity="0.42"/>
    <circle cx="1330" cy="382" r="1.6" opacity="0.35"/>
    <circle cx="1424" cy="238" r="2.4" opacity="0.5"/>
    <circle cx="1512" cy="404" r="1.7" opacity="0.32"/>
    <circle cx="892" cy="336" r="1.9" opacity="0.3"/>
    <circle cx="1188" cy="452" r="2.1" opacity="0.36"/>
    <circle cx="1364" cy="520" r="1.5" opacity="0.3"/>
    <circle cx="1064" cy="560" r="2" opacity="0.28"/>
    <circle cx="1540" cy="120" r="1.8" opacity="0.4"/>
    <circle cx="760" cy="180" r="1.6" opacity="0.24"/>
    <circle cx="700" cy="420" r="1.4" opacity="0.2"/>
    <circle cx="640" cy="760" r="1.6" opacity="0.22"/>
    <circle cx="300" cy="840" r="1.8" opacity="0.24"/>
    <circle cx="180" cy="640" r="1.5" opacity="0.2"/>
  </g>
</svg>
