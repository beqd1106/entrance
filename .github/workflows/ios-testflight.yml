name: iOS TestFlight

# 手動実行：gh workflow run ios-testflight.yml
# （Macは不要。GitHubのmacOSランナーでビルドしてTestFlightへ配信します）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "マーケティングバージョン（例 1.0.0）"
        required: true
        default: "1.0.0"
      whats_new:
        description: "テスターへのメモ（TestFlightのWhat to Test）"
        required: false
        default: "ハウスルール体験の初回ビルドです。横持ちでお試しください。"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.beqd1106.entrance
  SCHEME: Houserule
  XCODE_PROJECT: ios/Houserule.xcodeproj

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 を選択（App Storeは iOS 26 SDK 必須）
        run: |
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: エンジンの自動テスト（失敗したら配信しない）
        run: |
          node test/run-tests.js
          node test/verify-shanten.js 2000
          node test/sim.js 5

      - name: Web資産をアプリ同梱用に配置
        run: node scripts/build-ios-www.js

      - name: ツール導入（XcodeGen / codemagic-cli-tools）
        run: |
          brew install xcodegen
          pip3 install --break-system-packages codemagic-cli-tools

      - name: ビルド番号を決める（TestFlightの最新+1）
        id: buildno
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # run_number だとアプリ側の実績とずれて 409（重複）になることがある。
          # TestFlight にある最新のビルド番号を正として +1 する。
          APP_ID=$(app-store-connect list-apps --bundle-id-identifier "$BUNDLE_ID" --json \
            | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["id"] if a else "")')
          echo "app id: $APP_ID"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || true)
          echo "latest testflight build: ${LATEST:-なし}"
          case "$LATEST" in
            ''|*[!0-9]*) NEXT=${{ github.run_number }} ;;
            *) NEXT=$((LATEST + 1)) ;;
          esac
          echo "次のビルド番号: $NEXT"
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Xcodeプロジェクト生成（バージョンを埋め込んでから）
        working-directory: ios
        run: |
          # build-ipa は追加のビルド設定を受け付けないため、定義側に書き込んでおく。
          # 生成は1回だけ（署名の後に再生成すると provisioning profile 設定が消える）
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"${{ inputs.version }}\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"${{ steps.buildno.outputs.number }}\"/" project.yml
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml
          xcodegen generate

      - name: 署名（証明書・プロビジョニングを自動取得）
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: IPAをビルド
        run: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$SCHEME"

      - name: TestFlightへアップロード
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          echo "Uploading: $IPA"
          app-store-connect publish \
            --path "$IPA" \
            --max-build-processing-wait 0

      - name: 成果物を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/ios/ipa/*.ipa
            build/ios/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7
