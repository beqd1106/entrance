name: iOS TestFlight

# 手動実行：gh workflow run ios-testflight.yml
# （Macは不要。GitHubのmacOSランナーでビルドしてTestFlightへ配信します）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "マーケティングバージョン（例 1.0.0）"
        required: true
        default: "1.0.0"
      whats_new:
        description: "テスターへのメモ（TestFlightのWhat to Test）"
        required: false
        default: "ハウスルール体験の初回ビルドです。横持ちでお試しください。"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.beqd1106.entrance
  SCHEME: Houserule
  XCODE_PROJECT: ios/Houserule.xcodeproj

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 を選択（App Storeは iOS 26 SDK 必須）
        run: |
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: エンジンの自動テスト（失敗したら配信しない）
        run: |
          node test/run-tests.js
          node test/run-server-tests.js
          node test/check-presets.js
          node test/verify-shanten.js 2000
          node test/sim.js 5

      - name: Web資産をアプリ同梱用に配置
        run: node scripts/build-ios-www.js

      - name: ツール導入（XcodeGen / codemagic-cli-tools）
        run: |
          brew install xcodegen
          pip3 install --break-system-packages codemagic-cli-tools

      - name: ビルド番号を決める（TestFlightの最新+1）
        id: buildno
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # run_number だとアプリ側の実績とずれて 409（重複）になることがある。
          # App Store Connect にある最新のビルド番号を正として +1 する。
          # 取得に失敗しても配信自体は止めない（run_number にフォールバック）。
          set +e
          app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json > apps.json 2>/dev/null
          APP_ID=$(python3 -c "import json;print(json.load(open('apps.json'))[0]['id'])" 2>/dev/null)
          echo "app id: ${APP_ID:-取得できず}"
          LATEST=''
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-build-number "$APP_ID" 2>/dev/null | tr -dc '0-9')
          fi
          echo "latest build: ${LATEST:-なし}"
          if [ -n "$LATEST" ]; then NEXT=$((LATEST + 1)); else NEXT=${{ github.run_number }}; fi
          echo "次のビルド番号: $NEXT"
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Xcodeプロジェクト生成（バージョンを埋め込んでから）
        working-directory: ios
        run: |
          # build-ipa は追加のビルド設定を受け付けないため、定義側に書き込んでおく。
          # 生成は1回だけ（署名の後に再生成すると provisioning profile 設定が消える）
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"${{ inputs.version }}\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"${{ steps.buildno.outputs.number }}\"/" project.yml
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml
          xcodegen generate
          # Info.plist の $(MARKETING_VERSION) 等はビルド設定の解決順によって
          # Xcode既定の 1.0 / 1 になることがある。実値を直接書き込んで確実にする。
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.buildno.outputs.number }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist

      - name: 署名（証明書・プロビジョニングを自動取得）
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: IPAをビルド
        run: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$SCHEME"

      - name: IPAの中身を検査（Info.plistが消えていないか）
        run: |
          # XcodeGen の info: 指定で Info.plist が丸ごと生成し直され、
          # 書いたキーが全部消えていたことがある。出来上がりを必ず見る。
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -o -q build/ios/ipa/*.ipa -d /tmp/ipacheck
          PLIST=$(find /tmp/ipacheck/Payload -maxdepth 2 -name Info.plist | head -1)
          echo "検査対象: $PLIST"
          FAIL=0
          for K in ITSAppUsesNonExemptEncryption CFBundleDisplayName UILaunchScreen \
                   UISupportedInterfaceOrientations UIRequiresFullScreen; do
            if /usr/libexec/PlistBuddy -c "Print :$K" "$PLIST" >/dev/null 2>&1; then
              echo "  OK   $K"
            else
              echo "::error::Info.plist に $K がありません（上書きされた可能性）"
              FAIL=1
            fi
          done
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          B=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "  版: $V (build $B)"
          if [ "$V" != "${{ inputs.version }}" ] || [ "$B" != "${{ steps.buildno.outputs.number }}" ]; then
            echo "::error::版番号が指定と違います（指定 ${{ inputs.version }} / ${{ steps.buildno.outputs.number }}）"
            FAIL=1
          fi
          exit $FAIL

      - name: TestFlightへアップロード
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          echo "Uploading: $IPA"
          # 内部グループ「社内テスト」は全ビルドを自動で受け取る設定なので、
          # ここで明示的に割り当てるとかえって失敗する（--beta-group は使わない）。
          app-store-connect publish \
            --path "$IPA" \
            --whats-new "${{ inputs.whats_new }}" \
            --max-build-processing-wait 20

      - name: 成果物を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/ios/ipa/*.ipa
            build/ios/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7
